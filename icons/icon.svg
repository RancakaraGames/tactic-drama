<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
<title id="t">TacTic Drama</title><desc id="d">Mahkota emas, papan klaket, simbol T-play, pita film ungu, dan tulisan TacTic Drama.</desc>
<defs>
